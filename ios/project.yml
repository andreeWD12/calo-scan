# Genera CaloScan.xcodeproj con:  brew install xcodegen && xcodegen generate
name: CaloScan
options:
  bundleIdPrefix: com.caloscan
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"          # solo iPhone
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  CaloScanCore:
    path: Packages/CaloScanCore
targets:
  CaloScan:
    type: application
    platform: iOS
    sources:
      - path: CaloScan
        excludes: ["**/*.md"]
    info:
      path: CaloScan/Resources/Info.plist
      properties:
        CFBundleDisplayName: CaloScan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: "CaloScan usa la fotocamera per fotografare i tuoi piatti e stimarne i valori nutrizionali."
        NSPhotoLibraryUsageDescription: "CaloScan accede alle foto che scegli per analizzare un piatto già fotografato."
        # Valori iniettati dagli xcconfig (vedi Config/Secrets.example.xcconfig)
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        PRIVACY_POLICY_URL: "$(PRIVACY_POLICY_URL)"
        TERMS_URL: "$(TERMS_URL)"
        SUPPORT_URL: "$(SUPPORT_URL)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_REVERSED_CLIENT_ID)", "caloscan"]
    entitlements:
      path: CaloScan/Resources/CaloScan.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caloscan.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: CaloScanCore
  CaloScanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CaloScanTests]
    dependencies:
      - target: CaloScan
schemes:
  CaloScan:
    build:
      targets:
        CaloScan: all
        CaloScanTests: [test]
    test:
      targets: [CaloScanTests]
      gatherCoverageData: true
