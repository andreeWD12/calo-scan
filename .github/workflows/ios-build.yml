# Compila l'app iOS su un Mac di GitHub a ogni push sui branch di lavoro,
# così gli errori di Swift si vedono prima di aprire Xcode.
name: Build iOS

on:
  push:
    branches: ["fase-*", "main"]
    paths: ["ios/**", "supabase/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", "supabase/**"]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Test della logica condivisa (Node)
        run: node --experimental-strip-types --test supabase/functions/_shared/*.test.ts
      - name: Controllo dei tipi delle Edge Functions (Deno)
        run: deno check supabase/functions/*/index.ts
      - name: Migrazioni e test di sicurezza del database (RLS, permessi, inviti)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: supabase/tests/run.sh
      - name: Prova dal vivo di USDA e Open Food Facts
        run: deno run --allow-net --allow-env supabase/functions/_shared/fooddb.live.ts

  build:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Versione di Xcode
        run: xcodebuild -version
      - name: Test della logica condivisa (CaloScanCore)
        working-directory: ios/Packages/CaloScanCore
        run: set -o pipefail; swift test 2>&1 | grep -E "error|failed|Executed" | tail -40
      - name: Genera il progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compila app e test (simulatore, senza firma)
        run: |
          xcodebuild build-for-testing \
            -project CaloScan.xcodeproj -scheme CaloScan \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
      - name: Errori e avvisi di concorrenza
        if: always()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
          echo "--- avvisi Sendable/isolamento ---"
          grep -E "warning:.*(Sendable|isolat|concurren)" build.log | sort -u | head -60 || true
          tail -5 build.log
      - name: Screenshot delle sezioni (simulatore, modalità anteprima)
        if: success()
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']))")
          echo "Simulatore: $UDID"
          mkdir -p "$PWD/screens"
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screens" xcodebuild test \
            -project CaloScan.xcodeproj -scheme CaloScan \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:CaloScanUITests \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > uitest.log 2>&1 || (grep -E "error:|failed|Failing" uitest.log | head -40; exit 1)
          ls -la screens
      - name: Screenshot ridotti nel log (per chi non può scaricare gli artifact)
        if: success()
        run: |
          for f in screens/*.png; do
            sips -s format jpeg -s formatOptions 60 -Z 700 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== IMG $(basename "${f%.png}") ==="; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "=== END ==="
          done
      - name: Carica gli screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ios/screens/*.png
          if-no-files-found: warn

  # Compila come per l'App Store (configurazione Release, per iPhone vero, senza firma):
  # trova subito gli errori che compaiono solo nell'archivio (es. codice usato solo in Debug).
  release:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Genera il progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compila in Release per iPhone (come l'archivio per l'App Store)
        run: |
          xcodebuild build \
            -project CaloScan.xcodeproj -scheme CaloScan -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > release.log 2>&1 || { grep -E "error:" release.log | sort -u | head -80; tail -20 release.log; exit 1; }
          grep -c "warning:" release.log || true
          echo "Build Release riuscita"
      - name: Controlli per l'App Store
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos/CaloScan.app" -maxdepth 6 | head -1)
          echo "App: $APP"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "✓ Manifest privacy incluso"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Info.plist"
          # La modalità anteprima (dati finti) non deve esistere nella build per l'App Store.
          if strings "$APP/CaloScan" | grep -q "PreviewStore"; then echo "✗ PreviewStore presente in Release"; exit 1; else echo "✓ Nessun dato d'anteprima in Release"; fi
          test -f "$APP/AppIcon60x60@2x.png" -o -f "$APP/Assets.car" && echo "✓ Icone presenti"

  # Screenshot per la pagina App Store: iPhone Pro Max (6,9", 1320 × 2868), piano Pro, dati d'esempio.
  # Scaricali da GitHub › Actions › questa esecuzione › Artifacts › app-store-screenshots.
  store-screenshots:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iphone          # 6,9" → 1320 × 2868
            match: "x['name'].startswith('iPhone') and 'Pro Max' in x['name']"
            artifact: app-store-screenshots
          - device: ipad            # 13" → 2064 × 2752
            match: "x['name'].startswith('iPad Pro') and '13' in x['name']"
            artifact: app-store-screenshots-ipad
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Genera il progetto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Prepara il simulatore (${{ matrix.device }}, barra di stato pulita)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if ${{ matrix.match }}))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl privacy "$UDID" grant camera com.andrewnalini.caloscan.app || true
      - name: Scatta gli screenshot
        run: |
          mkdir -p "$PWD/store"
          STORE_SCREENSHOTS=1 TEST_RUNNER_STORE_SCREENSHOTS=1 TEST_RUNNER_SCREENSHOT_DIR="$PWD/store" xcodebuild test \
            -project CaloScan.xcodeproj -scheme CaloScan \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:CaloScanUITests/AppStoreScreenshotsUITests \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO > store.log 2>&1 || (grep -E "error:|failed|Failing|Skipped" store.log | head -40; exit 1)
          grep -E "Skipped|passed|failed" store.log | tail -5
          for f in store/*.png; do echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | tail -2 | awk '{print $2}' | tr '\n' 'x')"; done
      - name: Anteprime ridotte nel log
        if: success()
        run: |
          for f in store/*.png; do
            sips -s format jpeg -s formatOptions 60 -Z 700 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=== IMG store-${{ matrix.device }}-$(basename "${f%.png}") ==="; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "=== END ==="
          done
      # App Store Connect rifiuta le immagini con trasparenza: JPEG a piena risoluzione, senza canale alfa.
      - name: Converti in JPEG senza trasparenza
        if: success()
        run: |
          mkdir -p upload
          for f in store/*.png; do
            sips -s format jpeg -s formatOptions 92 "$f" --out "upload/$(basename "${f%.png}").jpg" >/dev/null
          done
          for f in upload/*.jpg; do echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight -g hasAlpha "$f" | tail -3 | awk '{print $2}' | tr '\n' ' ')"; done
      - name: Carica gli screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ios/upload/*.jpg
          if-no-files-found: warn
